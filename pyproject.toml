[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsig"
version = "0.1.0"
description = "Authorship-signal study of SKILL.md files in the GitSkills dataset"
requires-python = ">=3.13"
dependencies = [
    "duckdb==2.0.0",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    "datasketch==2.0.0",
    "httpx==0.28.1",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
data = [
    "huggingface_hub==2.0.0",
]
notebook = [
    "ipykernel==7.3.0",
    "seaborn==0.13.2",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[project.scripts]
skillsig = "skillsig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillsig*", "skill_genealogy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the full dataset",
    "network: needs GitHub",
    "slow: long-running",
]
addopts = "-m 'not data'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
